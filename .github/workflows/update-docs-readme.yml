name: Docs / Update README

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-docs-readme.yml'
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.hcl'
      - 'docker/**'
      - '**/*.tftpl'
      - 'ansible/**'
      - '.github/scripts/**'
      - '.github/python/requirements.txt'
      - '.terraform-docs.yml'
      - 'justfile'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-docs-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-update-readme:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TERRAFORM_DOC_TOKEN }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.42.4'

      - name: Configure documentation environment
        run: echo "DOCS_VENV=$RUNNER_TEMP/readme-docs-venv" >> "$GITHUB_ENV"

      - name: Install documentation dependencies
        run: |
          python3 -m venv "$DOCS_VENV"
          . "$DOCS_VENV/bin/activate"
          python3 -m pip install --disable-pip-version-check -r .github/python/requirements.txt

      - name: Install terraform-docs
        run: |
          go install github.com/terraform-docs/terraform-docs@v0.20.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Update README
        run: |
          . "$DOCS_VENV/bin/activate"
          just update-readme

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: 'docs(README): update documentation'
          commit_author: ${{ vars.GIT_AUTHOR_NAME }} <${{ vars.GIT_AUTHOR_EMAIL }}>
          commit_user_name: ${{ vars.GIT_AUTHOR_NAME }}
          commit_user_email: ${{ vars.GIT_AUTHOR_EMAIL }}
